<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 480" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="stage1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF1FB"/>
      <stop offset="100%" stop-color="#C7DBF7"/>
    </linearGradient>
    <linearGradient id="stage2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E6F2EC"/>
      <stop offset="100%" stop-color="#BFDFCD"/>
    </linearGradient>
    <linearGradient id="stage3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF5E2"/>
      <stop offset="100%" stop-color="#F5DCA8"/>
    </linearGradient>
    <linearGradient id="stage4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5E8F2"/>
      <stop offset="100%" stop-color="#D9B7D0"/>
    </linearGradient>
    <linearGradient id="inputGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F7F8"/>
      <stop offset="100%" stop-color="#DCDFE3"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F3A5F"/>
      <stop offset="100%" stop-color="#0F2444"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/>
    </marker>
  </defs>

  <!-- Title block -->
  <text x="620" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#111827" letter-spacing="0.2">GMSVM Pipeline</text>
  <text x="620" y="68" text-anchor="middle" font-size="13" font-weight="400" fill="#6B7280">Hybrid clustering and classification approach for credit scoring</text>

  <!-- =========================================================
       Stage geometry
       Each stage box: 200 x 170, top y=150, bottom y=320
       Internal text baselines (consistent across all stages):
         Header:        y=185
         Divider:       y=196
         Body line 1:   y=222
         Body line 2:   y=240
         Output line 1: y=268 (bold, accent color)
         Output line 2: y=286 (bold, accent color)
         Caption:       y=308 (italic, grey)
       ========================================================= -->

  <!-- Input -->
  <rect x="20" y="150" width="135" height="170" rx="10" ry="10" fill="url(#inputGrad)" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="87.5" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">Raw Credit</text>
  <text x="87.5" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">Data</text>
  <line x1="40" y1="234" x2="135" y2="234" stroke="#9CA3AF" stroke-width="1" opacity="0.5"/>
  <text x="87.5" y="258" text-anchor="middle" font-size="11" fill="#4B5563">Categorical and</text>
  <text x="87.5" y="274" text-anchor="middle" font-size="11" fill="#4B5563">numerical features</text>
  <text x="87.5" y="298" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">Imbalanced classes</text>
  <line x1="160" y1="235" x2="200" y2="235" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 1: Feature Engineering -->
  <rect x="205" y="150" width="200" height="170" rx="12" ry="12" fill="url(#stage1)" stroke="#3B6BB7" stroke-width="2"/>
  <text x="305" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3A5F">1. Feature Engineering</text>
  <line x1="230" y1="196" x2="380" y2="196" stroke="#3B6BB7" stroke-width="1" opacity="0.45"/>
  <text x="305" y="222" text-anchor="middle" font-size="11" fill="#1F2937">Target-encode</text>
  <text x="305" y="240" text-anchor="middle" font-size="11" fill="#1F2937">categorical features</text>
  <text x="305" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="#1F3A5F">→ RiskIndicator,</text>
  <text x="305" y="286" text-anchor="middle" font-size="11" font-weight="600" fill="#1F3A5F">a continuous variable</text>
  <text x="305" y="308" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">Reduces dimensionality</text>
  <line x1="410" y1="235" x2="450" y2="235" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: GM-SMOTE Oversampling -->
  <rect x="455" y="150" width="200" height="170" rx="12" ry="12" fill="url(#stage2)" stroke="#2E7D5A" stroke-width="2"/>
  <text x="555" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#0F4D2E">2. GM-SMOTE Oversampling</text>
  <line x1="480" y1="196" x2="630" y2="196" stroke="#2E7D5A" stroke-width="1" opacity="0.45"/>
  <text x="555" y="222" text-anchor="middle" font-size="11" fill="#1F2937">Fit GMM to minority</text>
  <text x="555" y="240" text-anchor="middle" font-size="11" fill="#1F2937">class via EM algorithm</text>
  <text x="555" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="#0F4D2E">→ Sample synthetic</text>
  <text x="555" y="286" text-anchor="middle" font-size="11" font-weight="600" fill="#0F4D2E">minority observations</text>
  <text x="555" y="308" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">Preserves distribution shape</text>
  <line x1="660" y1="235" x2="700" y2="235" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: GMM Denoising -->
  <rect x="705" y="150" width="200" height="170" rx="12" ry="12" fill="url(#stage3)" stroke="#B8761A" stroke-width="2"/>
  <text x="805" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#7A4E0F">3. GMM Denoising</text>
  <line x1="730" y1="196" x2="880" y2="196" stroke="#B8761A" stroke-width="1" opacity="0.45"/>
  <text x="805" y="222" text-anchor="middle" font-size="11" fill="#1F2937">Compute posterior</text>
  <text x="805" y="240" text-anchor="middle" font-size="11" fill="#1F2937">probability per point</text>
  <text x="805" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="#7A4E0F">→ Drop points below</text>
  <text x="805" y="286" text-anchor="middle" font-size="11" font-weight="600" fill="#7A4E0F">a 0.985 threshold</text>
  <text x="805" y="308" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">Removes noise and outliers</text>
  <line x1="910" y1="235" x2="950" y2="235" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: SVM Classification -->
  <rect x="955" y="150" width="200" height="170" rx="12" ry="12" fill="url(#stage4)" stroke="#7A3F8C" stroke-width="2"/>
  <text x="1055" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#4F2363">4. SVM Classification</text>
  <line x1="980" y1="196" x2="1130" y2="196" stroke="#7A3F8C" stroke-width="1" opacity="0.45"/>
  <text x="1055" y="222" text-anchor="middle" font-size="11" fill="#1F2937">Soft-margin SVM with</text>
  <text x="1055" y="240" text-anchor="middle" font-size="11" fill="#1F2937">linear or RBF kernel</text>
  <text x="1055" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="#4F2363">→ Tune C, gamma, k via</text>
  <text x="1055" y="286" text-anchor="middle" font-size="11" font-weight="600" fill="#4F2363">cross-validation</text>
  <text x="1055" y="308" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">AIC, BIC, Silhouette check</text>

  <!-- Connector: SVM Classification → Credit Decision (orthogonal path) -->
  <path d="M 1055 320 L 1055 360 L 620 360 L 620 388" stroke="#4B5563" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <!-- Output: Credit Decision -->
  <rect x="510" y="390" width="220" height="60" rx="10" ry="10" fill="url(#outputGrad)" stroke="#0F2444" stroke-width="1.5"/>
  <text x="620" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Credit Decision</text>
  <text x="620" y="436" text-anchor="middle" font-size="11" fill="#D6E4F5">Creditworthy  /  Default Risk</text>

  <!-- Footer -->
  <text x="620" y="470" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">
    Evaluated on Taiwanese, Australian, and Japanese UCI credit datasets — Accuracy, Recall, Precision, AUC
  </text>
</svg>
